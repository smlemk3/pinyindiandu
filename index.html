<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音四声墙 ∙ 趣味拼音</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.loli.net/css2?family=Noto+Sans:wght@400;700;900&family=Nunito:wght@400;600;700;800;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#f0fdf4 0%,#eff6ff 50%,#fdf4ff 100%);min-height:100vh}
.fun-font{font-family:'ZCOOL KuaiLe',cursive,sans-serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.animate-float{animation:float 3s ease-in-out infinite}
.pinyin-card{transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05)}
.pinyin-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 20px 35px -10px rgba(0,0,0,.12)}
.pinyin-card:active{transform:scale(.97)}
.chip{transition:all .15s ease;cursor:pointer}
.chip:hover{border-color:#6ee7b7;background:#ecfdf5}
.chip.active{background:linear-gradient(90deg,#10b981,#14b8a6);color:#fff;border-color:transparent}
.final-chip{font-family:'Noto Sans','Segoe UI','Microsoft YaHei',sans-serif}
.final-chip.active{background:#ecfdf5;border-color:#34d399;color:#047857;box-shadow:inset 0 0 0 1px #6ee7b7}
.final-chip.active:hover{background:#d1fae5}
.pinyin-glyph{font-family:'Noto Sans','Segoe UI','Microsoft YaHei',Nunito,sans-serif;font-feature-settings:"kern" 1}
.toolbar{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%)}
.btn-shuffle{
  appearance:none;border:1px solid #d1fae5;background:#ecfdf5;color:#047857;
  font-family:inherit;font-weight:700;font-size:0.9rem;
  padding:0.55rem 1.1rem;border-radius:999px;cursor:pointer;
  transition:all .15s ease;white-space:nowrap;
}
.btn-shuffle:hover{background:#10b981;border-color:#10b981;color:#fff}
.btn-shuffle:active{transform:scale(.97)}
</style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 md:p-8 text-slate-700">

<header class="w-full max-w-5xl mx-auto text-center py-6">
  <div class="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-sm font-bold mb-3 shadow-sm animate-float">
    <span>✨ 快乐学拼音 ∙ 四声音标墙</span>
  </div>
  <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 fun-font tracking-wide mb-3">
    拼音<span class="text-emerald-500">四声</span>大乱斗
  </h1>
  <p class="text-slate-500 text-sm md:text-base max-w-2xl mx-auto">
    点选韵母生成四声卡片（每行一声到四声）；需要时再打乱顺序练习。
  </p>
</header>

<main class="w-full max-w-5xl mx-auto bg-white/80 backdrop-blur-md rounded-3xl p-6 md:p-10 shadow-2xl border border-white flex flex-col items-center gap-6 my-auto">

  <div class="w-full toolbar rounded-2xl border border-slate-100 px-4 py-4 sm:px-5 space-y-3.5 shadow-sm">
    <div class="flex flex-wrap gap-2" id="groupChips"></div>
    <div class="h-px bg-slate-100"></div>
    <div class="flex flex-wrap gap-2" id="finalChips"></div>
  </div>

  <div class="w-full flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-tr from-emerald-400 to-teal-500 text-white flex items-center justify-center text-lg shadow-md">🎵</div>
      <div class="min-w-0">
        <p class="text-xl font-black text-slate-800 leading-tight" id="cardCount">0 个音标</p>
        <p class="text-sm text-slate-500 truncate" id="activeLabel"></p>
      </div>
    </div>
    <button type="button" id="btnShuffle" class="btn-shuffle self-start sm:self-auto">🔀 打乱顺序</button>
  </div>

  <p id="parseHint" class="w-full text-sm text-slate-500 -mt-2 hidden"></p>

  <div id="pinyinGrid" class="w-full grid grid-cols-4 gap-2 sm:gap-4 md:gap-6"></div>

  <div class="text-center bg-amber-50/80 border border-amber-100 px-4 py-3 rounded-2xl w-full">
    <p class="text-xs md:text-sm text-amber-800/90 font-medium">
      点击卡片播放本地发音。i / u / ü / ui / iu 等会映射为 yi / wu / yu / wei / you。
    </p>
  </div>
</main>

<footer class="text-center text-xs text-slate-400 py-6"><p>© 2026 趣味拼音启蒙 ∙ 互动音标墙</p></footer>

<script>
(function () {
  const GROUPS = {
    simple:   { label: '单韵母',   items: ['a', 'o', 'e', 'i', 'u', 'ü'] },
    compound: { label: '复韵母',   items: ['ai', 'ei', 'ui', 'ao', 'ou', 'iu', 'ie', 'üe', 'er'] },
    front:    { label: '前鼻韵母', items: ['an', 'en', 'in', 'un', 'ün'] },
    back:     { label: '后鼻韵母', items: ['ang', 'eng', 'ing', 'ong'] }
  };

  const ALL = [...GROUPS.simple.items, ...GROUPS.compound.items, ...GROUPS.front.items, ...GROUPS.back.items];

  const AUDIO = {
    a:'a', o:'o', e:'e', i:'yi', u:'wu', ü:'yu',
    ai:'ai', ei:'ei', ui:'wei', ao:'ao', ou:'ou', iu:'you', ie:'ye', üe:'yue', er:'er',
    an:'an', en:'en', in:'yin', un:'wen', ün:'yun',
    ang:'ang', eng:'eng', ing:'ying', ong:'yong'
  };

  const VOWEL = {
    // 拼音教材用单层 ɑ（U+0251），不用英文双层 a
    a: ['ɑ', 'ɑ\u0304', 'ɑ\u0301', 'ɑ\u030C', 'ɑ\u0300'],
    o: ['o', 'ō', 'ó', 'ǒ', 'ò'],
    e: ['e', 'ē', 'é', 'ě', 'è'],
    i: ['i', 'ī', 'í', 'ǐ', 'ì'],
    u: ['u', 'ū', 'ú', 'ǔ', 'ù'],
    ü: ['ü', 'ǖ', 'ǘ', 'ǚ', 'ǜ']
  };

  const TONE = [
    null,
    { name:'一声 阴平', desc:'高平调' },
    { name:'二声 阳平', desc:'高升调' },
    { name:'三声 上声', desc:'降升调' },
    { name:'四声 去声', desc:'全降调' }
  ];

  const THEME = [
    { color:'from-rose-400 to-pink-500', bg:'bg-rose-50', text:'text-rose-600' },
    { color:'from-amber-400 to-orange-500', bg:'bg-amber-50', text:'text-amber-600' },
    { color:'from-sky-400 to-blue-500', bg:'bg-sky-50', text:'text-sky-600' },
    { color:'from-emerald-400 to-teal-500', bg:'bg-emerald-50', text:'text-emerald-600' },
    { color:'from-violet-400 to-purple-500', bg:'bg-violet-50', text:'text-violet-600' },
    { color:'from-fuchsia-400 to-pink-500', bg:'bg-fuchsia-50', text:'text-fuchsia-600' },
    { color:'from-lime-400 to-green-500', bg:'bg-lime-50', text:'text-lime-600' },
    { color:'from-cyan-400 to-sky-500', bg:'bg-cyan-50', text:'text-cyan-600' }
  ];

  const KEY = 'pinyin-selected-finals';
  const $hint = document.getElementById('parseHint');
  const $count = document.getElementById('cardCount');
  const $label = document.getElementById('activeLabel');
  const $grid = document.getElementById('pinyinGrid');
  const $groups = document.getElementById('groupChips');
  const $finals = document.getElementById('finalChips');

  let selected = ['a', 'o', 'e'];
  let audioObj = null;

  function uniq(arr) { return [...new Set(arr)]; }

  // 展示用：把拉丁 a 换成拼音单层 ɑ
  function displayFinal(s) {
    return String(s).replace(/a/g, 'ɑ').replace(/A/g, 'ɑ');
  }

  function norm(s) {
    return String(s).trim().toLowerCase().replace(/u:/g, 'ü').replace(/v/g, 'ü');
  }

  function withTone(finalName, tone) {
    let s = norm(finalName);
    for (const v of ['a', 'o', 'e']) {
      const i = s.indexOf(v);
      if (i >= 0) return s.slice(0, i) + VOWEL[v][tone] + s.slice(i + 1);
    }
    if (s.includes('iu')) return s.replace('u', VOWEL.u[tone]);
    if (s.includes('ui')) return s.replace('i', VOWEL.i[tone]);
    for (const v of ['ü', 'u', 'i']) {
      const i = s.lastIndexOf(v);
      if (i >= 0) return s.slice(0, i) + VOWEL[v][tone] + s.slice(i + v.length);
    }
    return s;
  }

  function theme(letter) {
    const i = ALL.indexOf(letter);
    return THEME[(i >= 0 ? i : 0) % THEME.length];
  }

  function buildCards(list) {
    const cards = [];
    list.forEach((letter) => {
      const th = theme(letter);
      for (let t = 1; t <= 4; t++) {
        cards.push({
          char: withTone(letter, t),
          letter, tone: t,
          audio: AUDIO[letter] || letter,
          name: TONE[t].name,
          desc: TONE[t].desc,
          color: th.color, bg: th.bg, text: th.text
        });
      }
    });
    return cards;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function urls(audioKey, tone) {
    const k = audioKey + tone;
    // 优先本地 audio/，远程仅作备用
    return [
      'audio/' + k + '.mp3',
      'https://resources.allsetlearning.com/pronwiki/resources/pinyin-audio/' + k + '.mp3',
      'https://cdn.jsdelivr.net/gh/hugolpz/audio-cmn@master/64k/syllabs/cmn-' + k + '.mp3'
    ];
  }

  function speak(item) {
    const list = urls(item.audio, item.tone);
    let i = 0;
    if (audioObj) { audioObj.pause(); audioObj = null; }
    function next() {
      if (i >= list.length) return;
      const a = new Audio(list[i]);
      audioObj = a;
      a.play().catch(() => { i++; next(); });
      a.onerror = () => { i++; next(); };
    }
    next();
  }

  function render(doShuffle) {
    const cards = buildCards(selected);
    const list = doShuffle ? shuffle(cards) : cards;
    $grid.innerHTML = '';
    list.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = 'pinyin-card bg-white rounded-2xl sm:rounded-3xl p-2.5 sm:p-5 border border-slate-100 flex flex-col items-center justify-between gap-1.5 sm:gap-3 cursor-pointer select-none relative overflow-hidden group';
      el.innerHTML =
        '<div class="absolute top-1.5 left-1.5 sm:top-3 sm:left-3 w-5 h-5 sm:w-7 sm:h-7 rounded-full ' + item.bg + ' ' + item.text + ' text-[10px] sm:text-xs font-black flex items-center justify-center">' + (index + 1) + '</div>' +
        '<div class="absolute top-1.5 right-1.5 sm:top-3 sm:right-3 text-slate-300 group-hover:text-slate-500 text-xs sm:text-base">🔊</div>' +
        '<div class="mt-3 sm:mt-4 mb-1 sm:mb-2"><span class="pinyin-glyph text-2xl sm:text-5xl md:text-6xl font-black ' + item.text + '">' + item.char + '</span></div>' +
        '<div class="text-center w-full bg-slate-50 rounded-xl sm:rounded-2xl py-1.5 sm:py-2 px-1 sm:px-3 border border-slate-100 group-hover:bg-indigo-50/50">' +
          '<p class="text-[10px] sm:text-xs font-bold text-slate-700 leading-tight">' + item.name + '</p>' +
          '<p class="text-[9px] sm:text-[10px] text-slate-400 font-semibold hidden sm:block">' + item.desc + ' ∙ ' + displayFinal(item.letter) + '</p>' +
        '</div>';
      el.addEventListener('click', () => {
        speak(item);
        el.classList.add('scale-95');
        setTimeout(() => el.classList.remove('scale-95'), 150);
      });
      $grid.appendChild(el);
    });
    $count.textContent = list.length + ' 个音标 · ' + selected.length + ' 个韵母';
    $label.textContent = selected.length ? selected.map(displayFinal).join('  ') : '点上面的韵母开始练习';
  }

  function syncChips() {
    $finals.querySelectorAll('[data-final]').forEach((el) => {
      el.classList.toggle('active', selected.includes(el.dataset.final));
    });
    $groups.querySelectorAll('[data-group]').forEach((el) => {
      const k = el.dataset.group;
      if (k === 'all') el.classList.toggle('active', selected.length === ALL.length);
      else if (k === 'clear') el.classList.remove('active');
      else {
        const g = GROUPS[k];
        el.classList.toggle('active', !!(g && g.items.every((f) => selected.includes(f))));
      }
    });
  }

  function save() { localStorage.setItem(KEY, JSON.stringify(selected)); }

  function setHint(html, isError) {
    if (!html) {
      $hint.classList.add('hidden');
      $hint.innerHTML = '';
      return;
    }
    $hint.classList.remove('hidden');
    $hint.innerHTML = html;
    $hint.className = 'w-full text-sm -mt-2 ' + (isError ? 'text-rose-600 font-semibold' : 'text-slate-500');
  }

  function setSel(list, doShuffle) {
    selected = uniq(list.filter((f) => ALL.includes(f)));
    save();
    syncChips();
    setHint('');
    render(!!doShuffle);
  }

  function toggle(finalName) {
    if (selected.includes(finalName)) selected = selected.filter((f) => f !== finalName);
    else selected = [...selected, finalName];
    selected = ALL.filter((f) => selected.includes(f));
    save();
    syncChips();
    if (!selected.length) {
      $grid.innerHTML = '';
      $count.textContent = '0 个音标';
      $label.textContent = '点上面的韵母开始练习';
      setHint('请至少选择一个韵母', true);
      return;
    }
    setHint('');
    render(false);
  }

  function buildUI() {
    $groups.innerHTML = '';
    function addGroup(key, label, fn, extraClass) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.group = key;
      btn.className = 'chip px-3 py-1.5 rounded-full border border-slate-200 bg-white text-sm font-bold text-slate-600 ' + (extraClass || '');
      btn.textContent = label;
      btn.addEventListener('click', fn);
      $groups.appendChild(btn);
    }
    addGroup('all', '全部', () => setSel(ALL));
    Object.keys(GROUPS).forEach((k) => addGroup(k, GROUPS[k].label, () => setSel(GROUPS[k].items)));
    addGroup('clear', '清空', () => {
      selected = [];
      save();
      syncChips();
      $grid.innerHTML = '';
      $count.textContent = '0 个音标';
      $label.textContent = '点上面的韵母开始练习';
      setHint('');
    }, 'text-slate-400 border-dashed');

    $finals.innerHTML = '';
    ALL.forEach((f) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.final = f;
      btn.className = 'final-chip chip px-2.5 py-1 rounded-lg border border-slate-200 bg-white text-sm font-black text-slate-700 min-w-[2.5rem]';
      btn.textContent = displayFinal(f);
      btn.title = '音频：' + (AUDIO[f] || f);
      btn.addEventListener('click', () => toggle(f));
      $finals.appendChild(btn);
    });
  }

  document.getElementById('btnShuffle').addEventListener('click', () => {
    if (!selected.length) {
      setHint('请至少选择一个韵母', true);
      return;
    }
    setHint('');
    render(true);
  });

  buildUI();

  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (Array.isArray(saved) && saved.length) {
      selected = saved.map(norm).filter((f) => ALL.includes(f));
    }
  } catch (e) {}

  if (!selected.length) selected = ['a', 'o', 'e'];
  syncChips();
  setHint('');
  render(false);
})();
</script>
</body>
</html>
